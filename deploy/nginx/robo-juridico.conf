# Configuração Nginx de Produção — Robô Jurídico SaaS
# Arquivo: /etc/nginx/sites-available/robo-juridico.conf

# Rate limiting por endereço IP do cliente (30 req/s com burst de 60)
limit_req_zone $binary_remote_addr zone=rj_global_limit:10m rate=30r/s;
limit_req_status 429;

# Redirecionamento forçado de HTTP para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS com isolamento e cabeçalhos de segurança
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # Certificados TLS (Let's Encrypt ou autoridade oficial)
    ssl_certificate /etc/ssl/certs/robo-juridico.crt;
    ssl_certificate_key /etc/ssl/private/robo-juridico.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeçalhos de Segurança Estritos (Defense-in-Depth)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Limite de corpo de requisição (compatível com uploads CSV de até 2 MiB)
    client_max_body_size 4M;

    # Bloqueio de arquivos ocultos e de controle de versão
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Cache de arquivos estáticos servidos pelo app Go
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy reverso principal para a aplicação Go
    location / {
        limit_req zone=rj_global_limit burst=60 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts rigorosos para proteger recursos de rede
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Desativa buffering desnecessário
        proxy_buffering off;
    }
}
