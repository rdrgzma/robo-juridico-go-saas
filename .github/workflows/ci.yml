name: Docker Go checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated development configuration
        run: bash scripts/dev.sh init
      - name: Start development services
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Formatting
        run: |
          docker compose exec -T app go fmt ./...
          git diff --exit-code -- '*.go'
      - run: docker compose exec -T app go mod verify
      - run: docker compose exec -T app go run ./cmd/migrate up
      - run: docker compose exec -T app go vet ./...
      - run: docker compose exec -T app go test -race -count=1 ./...
      - name: Dependency vulnerability scan
        run: docker compose exec -T app go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Smoke and hot reload
        run: docker compose exec -T app go run ./cmd/devverify
      - name: Non-root runtime image
        run: docker build -f docker/production/Dockerfile -t robo-juridico-go-saas:ci .
      - name: Logs
        if: failure()
        run: docker compose logs --tail 80 app
      - name: Stop services preserving volumes
        if: always()
        run: docker compose down
