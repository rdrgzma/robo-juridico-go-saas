<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentação da API · Swagger UI · Robô Jurídico</title>
  <link rel="stylesheet" href="/static/swagger/swagger-ui.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .topbar-rj {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.5rem;
      background: #0f172a;
      color: #fff;
      border-bottom: 1px solid #1e293b;
    }
    .topbar-rj a {
      color: #93c5fd;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .topbar-rj a:hover {
      text-decoration: underline;
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.125rem;
      color: #fff !important;
    }
    .topbar-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    .swagger-ui .topbar {
      display: none;
    }
    .swagger-ui .info {
      margin: 2rem 0;
    }
    .swagger-ui .info .title {
      font-family: inherit;
      color: #0f172a;
    }
    .swagger-ui .scheme-container {
      background: #f1f5f9;
      box-shadow: none;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      margin-bottom: 2rem;
    }
    .swagger-ui .btn.authorize {
      background-color: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }
    .swagger-ui .btn.authorize svg {
      fill: #fff;
    }
  </style>
</head>
<body>
  <header class="topbar-rj">
    <a href="/" class="topbar-brand">
      <span>⚖</span>
      <span>Robô Jurídico <small style="font-size:0.75rem;font-weight:400;color:#94a3b8">API v1</small></span>
    </a>
    <nav class="topbar-links" aria-label="Navegação da documentação">
      <a href="/">← Início</a>
      <a href="/app">Espaço Jurídico (/app)</a>
      <a href="/portal">Portal (/portal)</a>
      <a href="/openapi.json" target="_blank" rel="noopener">OpenAPI JSON ↗</a>
      <a href="/health/ready" target="_blank" rel="noopener">Readiness ↗</a>
    </nav>
  </header>

  <div id="swagger-ui"></div>

  <script src="/static/swagger/swagger-ui-bundle.js"></script>
  <script src="/static/swagger/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "StandaloneLayout",
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        docExpansion: "list",
        filter: true,
        showExtensions: true,
        showCommonExtensions: true,
        persistAuthorization: true
      });
    };
  </script>
</body>
</html>
